<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project Aura - Transform SOWs into Project Plans{% endblock %}</title>

    <!-- Google Fonts: Montserrat, Open Sans, Varela -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&family=Varela&display=swap" rel="stylesheet">

    <!-- Blend Design System CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/blend.css') }}">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('projectAuraTheme') || 'dark';
            document.documentElement.dataset.theme = savedTheme;
        })();
    </script>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    {% block extra_css %}{% endblock %}
</head>
<body class="blend-dark">
    <script>
        document.body.className = (localStorage.getItem('projectAuraTheme') === 'light') ? 'blend-light' : 'blend-dark';
    </script>
    <!-- Header -->
    <header class="header-with-logo">
        <div class="blend-logo" style="height: 18px;">
            <a href="/" style="display: block; height: 18px;">
                <img src="https://cdn.prod.website-files.com/64c8fffb0e95cbc525815b79/6515cb33073a7b192024a680_blend360.svg" alt="Blend360" style="height: 18px; display: block; width: auto;">
            </a>
        </div>
        <div class="header-actions">
            <nav>
                <a href="/">Home</a>
                <a href="/api/results" style="display: none;" id="resultsNav">Results</a>
            </nav>
            <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light theme" aria-pressed="true">
                <i class="fas fa-sun theme-toggle-icon" aria-hidden="true"></i>
                <span class="theme-toggle-text">Light</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>Project Aura &copy; 2026 | AI-Powered Project Management for Blend</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script>
        (function () {
            const body = document.body;
            const toggle = document.getElementById('themeToggle');
            const icon = toggle ? toggle.querySelector('.theme-toggle-icon') : null;
            const text = toggle ? toggle.querySelector('.theme-toggle-text') : null;

            function applyTheme(theme) {
                const normalizedTheme = theme === 'light' ? 'light' : 'dark';
                body.classList.toggle('blend-light', normalizedTheme === 'light');
                body.classList.toggle('blend-dark', normalizedTheme === 'dark');
                document.documentElement.dataset.theme = normalizedTheme;
                localStorage.setItem('projectAuraTheme', normalizedTheme);

                if (!toggle || !icon || !text) return;

                const isDark = normalizedTheme === 'dark';
                toggle.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
                toggle.setAttribute('aria-pressed', String(isDark));
                icon.className = isDark ? 'fas fa-sun theme-toggle-icon' : 'fas fa-moon theme-toggle-icon';
                text.textContent = isDark ? 'Light' : 'Dark';
            }

            applyTheme(localStorage.getItem('projectAuraTheme') || 'dark');

            if (toggle) {
                toggle.addEventListener('click', function () {
                    applyTheme(body.classList.contains('blend-dark') ? 'light' : 'dark');
                });
            }
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
